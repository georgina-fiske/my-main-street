<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My Main Street – Croydon (demo)</title>
  <meta name="description" content="A demo of My Main Street. Shops and prizes are made up.">
  <meta name="theme-color" content="#560CC9">
  <link rel="icon" href="/img/fruitbowl-logo-white.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <a class="skip" href="#app">Skip to content</a>
  <header>
    <div class="wrap">
      <div class="top">
        <span id="logo"></span>
        <div>
          <div class="street"><span id="streetName"></span> <span class="demo">Demo, not live yet</span></div>
          <h1 id="siteName"></h1>
        </div>
      </div>
      <nav id="nav" aria-label="Choose a screen"></nav>
    </div>
  </header>

  <main class="wrap" id="app" tabindex="-1"></main>

  <footer class="foot">
    <p>This is a demo. Shops and prizes are made up. Nothing here is real.</p>
    <button type="button" class="btn ghost small" data-act="reset">Reset demo</button>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <dialog id="dlg" class="dlg"></dialog>

  <script src="/vendor/supabase.js"></script>
  <script src="/vendor/qrcode.js"></script>
  <script src="/vendor/jsbarcode.min.js"></script>
  <script src="/vendor/jsqr.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/db.js"></script>
  <script src="/js/util.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
