<!doctype html>
<html lang="en-AU">
<head>

  <title>My Main Street demo</title>
  <meta name="description" content="A demo of My Main Street. Shops and prizes are made up.">
  <meta name="theme-color" content="#560CC9">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23560CC9'/%3E%3C/svg%3E">

  <a class="skip" href="#app">Skip to content</a>

      <div class="brand">

          <div class="brand-name" id="siteName"></div>

    <button type="button" class="btn ghost" data-act="reset">Reset demo</button>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="dlg" class="dlg"></dialog>

  <script src="/vendor/supabase.js"></script>
  <script src="/vendor/qrcode.js"></script>
  <script src="/vendor/jsbarcode.min.js"></script>
  <script src="/vendor/jsqr.js"></script>
  <script src="/js/config.js"></script>
